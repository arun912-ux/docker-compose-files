---

services:

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flare_solverr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Kolkata
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
#    volumes:
#      - ~/docker/data/config/flaresolverr:/config
    ports:
      - 8191:8191

    restart: unless-stopped
    networks:
     - arr


networks:
  arr:
    external: true

