---

services:

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - UMASK=002
      - TZ=Asia/Kolkata
      - WEBUI_PORTS=9696/tcp 
    volumes:
      - ~/Server/appdata/prowlarr:/config
      # - /data:/data
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - arr


networks:
  arr:
    external: true

