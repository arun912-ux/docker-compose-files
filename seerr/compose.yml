---

services:
  seerr:
    image: ghcr.io/hotio/seerr:latest
    container_name: seerr
    user: 0:0
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
      - PUID=0
      - PGID=0
      - UMASK=002
    ports:
      - 5055:5055
    volumes:
      - ~/Server/appdata/seerr:/app/config
    restart: unless-stopped
    networks:
      - arr
    dns:
      - 9.9.9.9 
      - 1.1.1.1
      - 8.8.8.8


networks:
  arr:
    external: true

