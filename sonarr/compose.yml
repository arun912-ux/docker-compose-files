---

services:

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - UMASK=002
      - UMASK_SET=002
      - TZ=Asia/Kolkata
    volumes:
      - ~/Server/appdata/sonarr:/config
      - /mnt/mergerfs_storage/mergerfs_data:/data

    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - arr


networks:
  arr:
    external: true





